<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOL ONE</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f5f5;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
.card{background:#fff;padding:40px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.15);text-align:center;width:420px}
button{background:#000;color:#fff;border:none;padding:16px 28px;font-size:18px;border-radius:8px;cursor:pointer;width:100%}
.links{margin-top:30px}.links a{display:block;margin:10px;color:#06c;text-decoration:none}
</style>
</head>
<body>
<div class="card">
<h1>SOL ONE</h1>
<p>Official website for the SOL ONE TikTok application.</p>
<button onclick="loginTikTok()">Continue with TikTok</button>
<div class="links">
<a href="privacy.html">Privacy Policy</a>
<a href="terms.html">Terms of Service</a>
</div>
<p>Contact : solslf@naver.com</p>
</div>
<script>
const clientKey="awhrg7l1ibm76noc";
const redirectUri=encodeURIComponent("https://avidacity-design.github.io/sol-one-site/callback.html");
function loginTikTok(){
const state=Math.random().toString(36).substring(2);
location.href="https://www.tiktok.com/v2/auth/authorize/?client_key="+clientKey+"&response_type=code&scope=user.info.basic&redirect_uri="+redirectUri+"&state="+state;
}
</script>
</body>
</html>
