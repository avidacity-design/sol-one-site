<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sol One</title>
<style>
  :root { color-scheme: light; }
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #fafafa; color: #111;
  }
  main { text-align: center; padding: 24px; }
  h1 { font-size: 28px; font-weight: 600; margin: 0 0 8px; letter-spacing: -0.02em; }
  p { color: #666; margin: 0 0 32px; font-size: 15px; }
  button {
    font: inherit; font-weight: 600; font-size: 15px;
    background: #111; color: #fff;
    border: 0; border-radius: 8px;
    padding: 14px 28px; cursor: pointer;
  }
  button:hover { background: #000; }
  button:focus-visible { outline: 2px solid #fe2c55; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>Sol One</h1>
  <p>Sign in to save your searches.</p>
  <button id="login">Continue with TikTok</button>
</main>

<script>
  // TikTok Sandbox client key
  const CLIENT_KEY  = 'sbawk6g1ncfj8ztx75';
  const REDIRECT_URI = 'https://solone-auth.avidacity.workers.dev/callback';
  const SCOPE        = 'user.info.basic';

  document.getElementById('login').addEventListener('click', () => {
    // CSRF 방지용 state 값을 만들어 저장해 둡니다.
    const state = crypto.randomUUID();
    sessionStorage.setItem('tiktok_state', state);

    const url = new URL('https://www.tiktok.com/v2/auth/authorize/');
    url.searchParams.set('client_key', CLIENT_KEY);
    url.searchParams.set('scope', SCOPE);
    url.searchParams.set('response_type', 'code');
    url.searchParams.set('redirect_uri', REDIRECT_URI);
    url.searchParams.set('state', state);

    window.location.href = url.toString();
  });
</script>
</body>
</html>
