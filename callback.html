<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sol One — 로그인 결과</title>
<style>
  :root { color-scheme: light; }
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #fafafa; color: #111;
  }
  main { width: min(560px, 90vw); padding: 24px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 20px; letter-spacing: -0.02em; }
  .box {
    background: #fff; border: 1px solid #e5e5e5; border-radius: 10px;
    padding: 20px; font-size: 14px; line-height: 1.7;
    word-break: break-all;
  }
  .k { color: #888; display: inline-block; min-width: 90px; }
  .ok { color: #0a7d32; font-weight: 600; }
  .err { color: #c0261c; font-weight: 600; }
  a { color: #111; font-size: 14px; display: inline-block; margin-top: 20px; }
</style>
</head>
<body>
<main>
  <h1>로그인 결과</h1>
  <div class="box" id="out">확인 중…</div>
  <a href="./index.html">← 처음으로</a>
</main>

<script>
  const p     = new URLSearchParams(location.search);
  const code  = p.get('code');
  const state = p.get('state');
  const error = p.get('error');
  const desc  = p.get('error_description');
  const saved = sessionStorage.getItem('tiktok_state');
  const out   = document.getElementById('out');

  const esc = s => String(s).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

  if (error) {
    out.innerHTML = `<span class="err">인증 실패</span><br>
      <span class="k">error</span> ${esc(error)}<br>
      <span class="k">설명</span> ${esc(desc || '없음')}`;
  } else if (!code) {
    out.innerHTML = `<span class="err">code 없음</span><br>
      index.html의 버튼을 거치지 않고 직접 열면 이 화면이 나옵니다.`;
  } else if (saved && state !== saved) {
    out.innerHTML = `<span class="err">state 불일치</span><br>
      요청과 응답의 state 값이 다릅니다. 다시 시도하세요.`;
  } else {
    out.innerHTML = `<span class="ok">인증 코드 수신 성공</span><br>
      <span class="k">code</span> ${esc(code)}<br><br>
      여기까지 나오면 포털 설정은 정상입니다.
      이 code를 access token으로 바꾸는 단계는 client secret이 필요해서
      서버에서 처리해야 합니다.`;
    sessionStorage.removeItem('tiktok_state');
  }
</script>
</body>
</html>
